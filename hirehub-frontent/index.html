<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HireHub</title>
    
    <style>
      *, *::before, *::after {
        box-sizing: border-box !important;
      }

      html, body {
        width: 100% !important;
        max-width: 100vw !important;
        margin: 0 !important;
        padding: 0 !important;
        overflow-x: hidden !important;
      }

      #root {
        width: 100% !important;
        max-width: 100vw !important;
        overflow-x: hidden !important;
      }

      /* MOBILE SCREEN FIX: Jo cheezein screen se bahar bhag rahi hain unhe screen mein fit karega */
      @media (max-width: 768px) {
        div, section, main, article, form, input, button, select, textarea {
          max-width: 100% !important;
          min-width: 0 !important;
        }

        /* Fixed width ko override karke responsive banayega */
        [class*="card"], [class*="job"], [class*="container"], [class*="wrapper"], [class*="box"] {
          width: 100% !important;
          max-width: 100% !important;
          margin-left: 0 !important;
          margin-right: 0 !important;
        }

        /* 2-column layout ko mobile par 1-column banayega */
        [class*="grid"], [class*="list"] {
          display: flex !important;
          flex-direction: column !important;
          width: 100% !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
